[package]
name = "obscatd"
version = "0.2.5"
edition = "2024"
build = "build.rs"

[dependencies]
clap = "4.6.9"
libc = "0.2.191"
libcontainer = "0.8.0"
liboci-cli = "0.8.0"
nix = { version = "0.32.0", features = ["process"] }
oci-spec = "0.10.0"
prost = "0.14.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["fs", "macros", "process", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

