[package]
name = "obscatd"
version = "0.1.2"
edition = "2024"
build = "build.rs"

[dependencies]
libc = "0.2.191"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.0", features = ["fs", "macros", "process", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

