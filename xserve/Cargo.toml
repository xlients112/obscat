[package]
name = "xserve"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
tonic = "0.14.6"
tonic-prost = " 0.14.6"
prost = "0.14.4"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
future-utils = "0.12.1"
tar = "0.4.46"
flate2 = "1.1.10"
tokio-stream = "0.1.19"

[build-dependencies]
tonic-prost-build = "0.14.6"

